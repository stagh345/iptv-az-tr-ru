name: Update IPTV Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python merge.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lah docs/

      - name: Commit updated playlists
        run: |
          git config user.name "IPTV Auto Updater"
          git config user.email "actions@github.com"

          git add docs/index.m3u
          git add docs/index.m3u8
          git add docs/test.m3u8

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update IPTV playlists"
            git push
          else
            echo "No playlist changes detected."
          fi
